services:
  postgres:
    image: postgres:15-alpine
    container_name: taskflow_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: taskflow_api
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/taskflow?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - PORT=3000
      - NODE_ENV=development
      - JWT_SECRET=oajfliwajf2wjafm2309tu039vm
      - JWT_EXPIRES_IN=15m
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Wait for database, deploy migrations, seed, and start the app
    command: >
      sh -c "
      echo 'Waiting for postgres...' &&
      npx prisma db push --accept-data-loss &&
      npm run db:seed &&
      npm run start"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: taskflow_worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/taskflow?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - JWT_SECRET=oajfliwajf2wjafm2309tu039vm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
